spring.application.name=accountservice
spring.datasource.url=jdbc:h2:mem:accountdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

spring.jpa.defer-datasource-initialization=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Swagger / OpenAPI Configuration ---
# Access UI at http://localhost:8080/swagger-ui/index.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# --- Logging Configuration ---
# Sets the log level for your specific package
logging.level.com.example.accountservice=INFO
# Root logging level
logging.level.root=INFO
# Optional: Save logs to a file for production auditing
logging.file.name=logs/account-service.log